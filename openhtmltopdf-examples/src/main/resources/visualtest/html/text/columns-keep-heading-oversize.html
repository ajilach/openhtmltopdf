<html>
<head>
<style>
/* Every block avoids the break after it, so the whole flow is one group taller than a column: avoiding is a preference, the content still fills both columns and nothing overflows the page. */
@page { size: 300px 220px; margin: 10px; }
body { margin: 0; font-size: 10px; line-height: 12px; }
.cols { column-count: 2; column-gap: 20px; column-fill: auto; }
div, p, h2 { margin: 0; }
.cols > div { white-space: nowrap; }
h2 { font-size: 10px; }
div { break-after: avoid; }
</style>
</head>
